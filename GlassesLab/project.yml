name: GlassesLab
options:
  bundleIdPrefix: com.glasseslab
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true

packages:
  MWDAT:
    # SDK oficial Meta Wearables Device Access Toolkit (misma URL y versión que usa el sample CameraAccess)
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1

settings:
  base:
    SWIFT_VERSION: "5.0"          # modo Swift 5 para reducir errores de concurrencia estricta
    IPHONEOS_DEPLOYMENT_TARGET: "17.2"

targets:
  GlassesLab:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.glasseslab.poc   # cámbialo por uno tuyo si usas cuenta de pago
        PRODUCT_NAME: GlassesLab
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # Developer Mode de Meta AI: vacío = sin atestación (válido para pruebas)
        META_APP_ID: ""
        CLIENT_TOKEN: ""
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
      - package: MWDAT
        product: MWDATInputs
      - package: MWDAT
        product: MWDATMotion
      - package: MWDAT
        product: MWDATSpeech

schemes:
  GlassesLab:
    build:
      targets:
        GlassesLab: all
    archive:
      config: Release
